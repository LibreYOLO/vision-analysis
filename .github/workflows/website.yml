name: Website

on:
  pull_request:
    paths:
      - "website/**"
      - "article-pipeline/v2/**"
      - "generated/verified-results.v1.json"
      - "submissions/**"
      - "scripts/**"
      - ".github/workflows/website.yml"
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "article-pipeline/v2/**"
      - "generated/verified-results.v1.json"
      - "submissions/**"
      - "scripts/**"
      - ".github/workflows/website.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install website dependencies
        run: npm ci --prefix website

      - name: Check benchmark coordinate compatibility
        run: npm test

      - name: Validate article content
        shell: bash
        run: |
          for article in website/src/content/articles/*.json; do
            python3 article-pipeline/v2/validate.py "$article"
          done

      - name: Lint website
        run: npm run lint --prefix website

      - name: Build website
        run: npm run build
